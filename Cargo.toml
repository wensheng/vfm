[package]
name = "vfm"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A small, fast, terminal file manager"
license = "Apache-2.0"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"
toml = "1"
regex-lite = "0.1"
infer = { version = "0.22", default-features = false }
trash = { version = "5", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9.1"

[features]
default = ["trash"]
trash = ["dep:trash"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = 3
